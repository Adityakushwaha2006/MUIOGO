[tool.ruff]
target-version = "py310"
line-length = 120
include = ["API/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E401",   # multiple imports on one line
    "E501",   # line too long
    "E402",   # module-level import not at top of file
    "E711",   # comparison to None using ==
    "E712",   # comparison to True/False using ==
    "E741",   # ambiguous variable name
    "F401",   # imported but unused
    "F601",   # multi-value repeated key literal
    "F811",   # redefinition of unused name
    "F841",   # local variable assigned but never used
    "I001",   # unsorted imports
    "UP015",  # redundant open modes
    "UP024",  # os-error-alias
    "UP030",  # format literals
    "UP031",  # printf string formatting
    "UP032",  # f-string
    "UP039",  # unnecessary class parentheses
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"API/Classes/Case/DataFileClass.py" = ["F821"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests/ogcore_standalone" is on the path so its shared _ogcore_specs helper
# imports as a top-level module from the OG-Core test files in that folder.
pythonpath = ["API", "tests", "tests/ogcore_standalone"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Default run excludes the heavy OG-Core pipeline tests. Opt in with:
#   pytest -m slow     reduced-dimension equivalence (minutes)
#   pytest -m gold     full-dimension gold-CSV match (hours)
addopts = "-v --tb=short -m 'not slow and not gold'"
markers = [
    "slow: reduced-dimension OG-Core pipeline equivalence run (opt-in, minutes)",
    "gold: full-dimension match vs official expected CSV (opt-in, hours)",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["API"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
